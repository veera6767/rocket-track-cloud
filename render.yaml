services:
  - type: web
    name: rocket-track-cloud
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DEVICE_KEY
        sync: false
      - key: VIEWER_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: RETENTION_DAYS
        value: "30"
