services:
  - type: web
    name: rocket-track-cloud
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DEVICE_KEY
        value: rocket_device_secret_2026
      - key: VIEWER_KEY
        value: ground_station_viewer_2026
      - key: ADMIN_KEY
        value: rocket_admin_supersecret_2026
      - key: CORS_ORIGINS
        value: "*"
      - key: RETENTION_DAYS
        value: "30"
